/sessions:
  post:
    tags: [Auth]
    summary: Login
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password]
            properties:
              email:
                type: string
                example: admin@boldstock.com
              password:
                type: string
                example: Admin@123
    responses:
      200:
        description: Login realizado com sucesso
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                user:
                  type: object
                  properties:
                    id: { type: string }
                    name: { type: string }
                    email: { type: string }
                    role: { type: string, enum: [ADMIN, VENDEDOR, ESTOQUISTA] }
      401:
        description: Credenciais inválidas
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'