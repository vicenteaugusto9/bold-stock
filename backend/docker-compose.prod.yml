version: '3.8'

# Configuração de produção com Docker
# Use este arquivo com: docker-compose -f docker-compose.prod.yml up

services:
  db:
    image: postgres:16-alpine
    container_name: bold-stock-db-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bold_stock}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bold-stock-network-prod
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bold-stock-api-prod
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-bold_stock}
      PORT: 3000
      NODE_ENV: production
    ports:
      - "3000:3000"
    networks:
      - bold-stock-network-prod
    restart: unless-stopped
    # Remova volumes em produção
    # volumes:
    #   - .:/app
    #   - /app/node_modules

volumes:
  postgres_data_prod:
    driver: local

networks:
  bold-stock-network-prod:
    driver: bridge
