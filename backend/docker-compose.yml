version: '3.8'

services:
  # Banco de dados PostgreSQL local
  db:
    image: postgres:16-alpine
    container_name: bold-stock-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bold_stock}
      POSTGRES_USER: ${POSTGRES_USER:-ogomezz_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zenithvG2026}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Corrigido para garantir que o ping de saúde teste a base correta
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-ogomezz_dev} -d $${POSTGRES_DB:-bold_stock}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bold-stock-network

  # Aplicação Backend (API)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bold-stock-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Ajustado o host de 'db' para 'bold-stock-db' para alinhar com o mapeamento do container na rede
      DATABASE_URL: postgresql://${POSTGRES_USER:-ogomezz_dev}:${POSTGRES_PASSWORD:-zenithvG2026}@bold-stock-db:5432/${POSTGRES_DB:-bold_stock}
      PORT: 3333
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "3333:3333"
    # Volumes comentados para desenvolvimento isolado, evitando conflito de escrita do Windows no Linux
    # volumes:
    #   - .:/app
    #   - /app/node_modules
    #   - /app/dist
    networks:
      - bold-stock-network
    command: npm start

  # Prisma Studio (Interface visual do Banco de Dados)
  prisma-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bold-stock-prisma-studio
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Ajustado o host para garantir comunicação direta com o banco local
      DATABASE_URL: postgresql://${POSTGRES_USER:-ogomezz_dev}:${POSTGRES_PASSWORD:-zenithvG2026}@bold-stock-db:5432/${POSTGRES_DB:-bold_stock}
    ports:
      - "5555:5555"
    networks:
      - bold-stock-network
    command: npx prisma studio
    profiles:
      - studio

volumes:
  postgres_data:
    driver: local

networks:
  bold-stock-network:
    driver: bridge